site_name: Hemostatic Gauze Comparative Analysis
site_description: WoundClot-led evidence review comparing hemostatic gauze and hemorrhage-control adjuncts for traumatic bleeding and major haemorrhage.
site_url: https://ajdench.github.io/WoundClot/
repo_url: https://github.com/ajdench/WoundClot
repo_name: ajdench/WoundClot
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - toc.integrate
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Home: index.md
  - Comparative Analysis: comparative-analysis.md
  - Product Comparison: product-comparison.md
  - Product Family Variants: product-family-variants.md
  - Wider Research Space: wider-research-space.md
  - Further Research Priorities: further-research-priorities.md
  - Evidence Matrix: evidence-matrix.md
  - Product Notes:
      - WoundClot: products/woundclot.md
      - Celox: products/celox.md
      - Combat Gauze: products/combat-gauze.md
      - ChitoGauze: products/chitogauze.md
      - Plain Gauze: products/plain-gauze.md
      - XStat and Surgicel: products/xstat-surgicel.md
  - Sources: sources.md
  - Research Log: log.md
